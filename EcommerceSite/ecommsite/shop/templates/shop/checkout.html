<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>CheckOut</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="col-md-12">
          <ul id="item_list" class="list-group">
            
          </ul>
        </div>
      </div>
      <div class="row">
        <div class="col-md-12">
          <form method="POST">
            {% csrf_token %}
            <input type="hidden" id="items" name="items">
            <input type="hidden" id="total" name="total">

            <div class="row mb-3">
              <div class="col-md-6">
                <label for="inputName" class="form-label">Name</label>
                <input id="name" name="name" type="text" class="form-control"  placeholder="John">
              </div>
              <div class="col-md-6">
                <label for="inputEmail4" class="form-label">Email</label>
                <input id="mail" name="mail" type="email" class="form-control"  placeholder="john@gmail.com">
              </div>
            </div>
          
            <div class="mb-3">
              <label for="inputAddress" class="form-label">Address</label>
              <input id="address" name="address" type="text" class="form-control"  placeholder="1234 Main St">
            </div>
          
            <div class="row mb-3">
              <div class="col-md-6">
                <label for="inputCity" class="form-label">City</label>
                <input id="city" name="city" type="text" class="form-control">
              </div>
              <div class="col-md-4">
                <label for="inputState" class="form-label">State</label>
                <input id="state" name="state" type="text" class="form-control" >
              </div>
              <div class="col-md-2">
                <label for="inputZip" class="form-label">Zip</label>
                <input id="zipcode" name="zipcode" type="text" class="form-control" >
              </div>
            </div>
          
            <button type="submit" class="btn btn-primary" onclick="RemoveCartItem()">Place Order</button>
          </form>
          
        </div>
      </div>
    </div>
  </body>
  <script type="text/javascript">
    if (localStorage.getItem('cart')==null){
      var cart={};
    }
    else{
      cart=JSON.parse(localStorage.getItem('cart'));
    }
    let total=0;
    for (item in cart){
      let name= cart[item][1];
      let quantity=cart[item][0];
      let price=cart[item][2];
      total=total+cart[item][2];
      itemString=`<li class="list-group-item d-flex justify-content-between align-items-center">${name}-${quantity} <span class="badge bg-primary rounded-pill">$${price}</span></li> `;

      $('#item_list').append(itemString);
      
    }
    totalPrice=`<li class="list-group-item d-flex justify-content-between align-items-center"><b>Your Total Amount: </b> <span class="badge bg-warning">$${total}</span></li> `;
    $('#item_list').append(totalPrice);
    $('#items').val(JSON.stringify(cart));
    $('#total').val(total);

    function RemoveCartItem(){
      if (localStorage.getItem!=undefined){
        localStorage.clear();
      }
    }
  </script>
</html>
