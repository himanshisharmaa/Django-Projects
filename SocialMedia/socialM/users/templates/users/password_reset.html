{% extends 'users/base.html' %}
{% block body %}
<h2 class="text-2xl m-7 font-bold text-center">Reset Password 🗝</h2>


    {% comment %} <h1 class="text-2xl mt-3">Edit Profile Form</h1> {% endcomment %}
    <form method="post" class="bg-white shadow-md m-10  rounded px-8 pt-6 pb-8 mb-4">
        {% csrf_token %}
        <div class="mb-2">
            <label class="block text-gray-700 text-sm font-bold mb-2">Email</label>
            <div class="shadow  appearance-none text-gray-700 border rounded py-2 px-3 mr-10">{{ form.email }}</div>
           
        </div>
        <button class="text-white bg-green-500 px-5 py-2 mt-2 " type="submit">Submit</button>
       
    </form>
{% endblock %}
